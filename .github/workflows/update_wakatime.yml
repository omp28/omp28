name: Update WakaTime Daily Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch WakaTime Daily Stats
        run: |
          curl -s "https://wakatime.com/api/v1/users/current/stats/today?api_key=${{ secrets.WAKATIME_API_KEY }}" > wakatime.json

      - name: Update README
        run: |
          echo "## 📊 WakaTime Daily Stats" > README.md
          echo "\`Generated on $(date)\`" >> README.md
          cat wakatime.json | jq -r '.data.languages[] | "- \(.name): \(.text)"' >> README.md
          echo "\n" >> README.md
          cat existing_readme.md >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add README.md
          git commit -m 'Update WakaTime stats [skip ci]' || echo "No changes to commit"
          git push
